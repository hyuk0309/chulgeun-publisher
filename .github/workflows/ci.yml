name: 검사

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: 단위 테스트
        run: python3 -m unittest discover -s tests -v
      - name: 큐 검사
        run: python3 scripts/queue_tool.py validate
